name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    # REVA is Windows-first; CI runs on Windows so path/pragma/process
    # behavior is validated on the actual target platform.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy reva_core

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Contract tests
        run: pytest tests/contract -v

      - name: Security tests
        run: pytest tests/security -v

      - name: E2E tests
        run: pytest tests/e2e -v

      - name: Full suite with coverage
        run: pytest --cov=reva_core --cov-report=term-missing --cov-report=xml

      - name: Package/import smoke test
        run: python -c "import reva_core; print(reva_core.__version__)"

      - name: Core startup/shutdown smoke test
        run: python -m reva_core
        env:
          REVA_DATA_DIR: ${{ runner.temp }}/reva-ci-data

      - name: Migration/bootstrap script check
        run: python scripts/verify_bootstrap.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  csharp-desktop:
    # windows-latest ships Visual Studio with the WinUI/Windows App SDK
    # MSBuild components preinstalled, so plain `dotnet build`/`dotnet
    # test` work with no VS-path overrides — confirmed locally against
    # the same WindowsAppSDK 2.3.1 baseline this project uses.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore desktop\Reva.Desktop.sln

      - name: Build
        run: dotnet build desktop\Reva.Desktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test desktop\Reva.Desktop.sln --configuration Release --no-build

  contracts:
    # Every schema in contracts/ must be a valid JSON Schema, and contracts/
    # must match docs/spec/REVA_v2.0/08_CONTRACTS.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate contracts
        run: python tools/ci/check_contracts.py

  kernel:
    # Placeholder until S04 creates the Rust crate. Replace with
    # `cargo test -p reva-kernel` and `cargo clippy` then.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Kernel placeholder
        run: |
          test -f kernel/README.md
          if [ -f kernel/Cargo.toml ]; then echo "kernel/Cargo.toml exists: replace this placeholder lane (S04)" && exit 1; fi
          echo "kernel lane is a placeholder until S04"

  android:
    # Placeholder until S11 creates the Gradle project. Replace with
    # `./gradlew lint testDebugUnitTest` then.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Android placeholder
        run: |
          test -f android/README.md
          if [ -f android/gradlew ]; then echo "android/gradlew exists: replace this placeholder lane (S11)" && exit 1; fi
          echo "android lane is a placeholder until S11"
