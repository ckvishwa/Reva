name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only superseded PR runs are cancelled. Push/release verification has a unique group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    # REVA is Windows-first; CI runs on Windows so path/pragma/process
    # behavior is validated on the actual target platform.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache

      # The Core loads the Rust Domain Kernel through its generated Python binding.
      - name: Build Domain Kernel binding
        run: python tools/kernel/build_bindings.py

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy reva_core

      - name: Verify collection equivalence
        run: python tools/ci/python_collection.py

      - name: Full suite with coverage (all suites, native Windows protection)
        run: python -m pytest --cov=reva_core --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml

      - name: Verify native Windows protection executed
        run: python tools/ci/python_collection.py --verify-results

      - name: Package/import smoke test
        run: python -c "import reva_core; print(reva_core.__version__)"

      - name: Core startup/shutdown smoke test
        run: python -m reva_core
        env:
          REVA_DATA_DIR: ${{ runner.temp }}/reva-ci-data

      - name: Migration/bootstrap script check
        run: python scripts/verify_bootstrap.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage.xml
            pytest-results.xml
            collection-*.txt

  python-linux:
    # Portable tests inject only the dialogue protector. Windows above keeps real DPAPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache

      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build Domain Kernel binding
        run: python tools/kernel/build_bindings.py
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Native Linux type check
        run: mypy reva_core
      - name: Full portable suite (including security and contracts)
        run: python -m pytest -q -ra
      - name: Validate contracts
        run: python tools/ci/check_contracts.py

  csharp-desktop:
    # windows-latest ships Visual Studio with the WinUI/Windows App SDK
    # MSBuild components preinstalled, so plain `dotnet build`/`dotnet
    # test` work with no VS-path overrides — confirmed locally against
    # the same WindowsAppSDK 2.3.1 baseline this project uses.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore desktop\Reva.Desktop.sln --locked-mode

      - name: Install the Windows App Runtime
        # The runner does not have it. Without it the unpackaged WinUI assembly waits for an install prompt
        # and test discovery hangs. The installers come from the restored (locked) Microsoft.WindowsAppSDK.Runtime
        # package, so the runtime always matches the version the app is built against.
        shell: pwsh
        run: |
          $packages = ((dotnet nuget locals global-packages --list) -replace "^global-packages:\s*", "").Trim()
          $msix = Get-ChildItem "$packages/microsoft.windowsappsdk.runtime/*/tools/MSIX/win10-x64/*.msix"
          if (-not $msix) { throw "Windows App Runtime installers not found in the restored package" }
          $order = "Microsoft.WindowsAppRuntime.2.msix","Microsoft.WindowsAppRuntime.Main.2.msix","Microsoft.WindowsAppRuntime.Singleton.2.msix","Microsoft.WindowsAppRuntime.DDLM.2.msix"
          foreach ($name in $order) { Add-AppxPackage -Path ($msix | Where-Object Name -eq $name).FullName }
          Get-AppxPackage *WindowsAppRuntime* | Select-Object Name,Version,Architecture

      - name: Build
        run: dotnet build desktop\Reva.Desktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test desktop\Reva.Desktop.sln --configuration Release --no-build --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

  contracts:
    # Every schema in contracts/ must be a valid JSON Schema, and contracts/
    # must match docs/spec/REVA_v2.0/08_CONTRACTS.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate contracts
        run: python tools/ci/check_contracts.py

  kernel:
    # Rust Domain Kernel: format, lint, native tests, then the same conformance suite through the
    # Python and Kotlin (JVM) bindings.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/rust-cache

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Native tests (recovery, sync, import, registry, no-network, conformance)
        run: cargo test -p reva-kernel

      - name: Build bindings
        run: python tools/kernel/build_bindings.py

      - name: Conformance through Python
        run: python -m pytest tests/cross_binding -q

      - name: Conformance through Kotlin (JVM)
        run: python tools/kernel/run_kotlin_conformance.py

  android:
    # Cross-build the Kernel for Android and verify the ELF files. The Kotlin suite runs on a device
    # or emulator from S11 (Android shell).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/rust-cache
        id: rust-cache
        with:
          target: aarch64-linux-android,x86_64-linux-android-release-api26

      - name: Cache cargo-ndk executable
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-ndk/bin
          key: cargo-ndk-4.1.2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.key }}

      - name: Install cargo-ndk
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked --root "${{ runner.temp }}/cargo-ndk"

      - name: Add cargo-ndk to PATH
        run: echo "${{ runner.temp }}/cargo-ndk/bin" >> "$GITHUB_PATH"

      - name: Build arm64-v8a and x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: python tools/kernel/build_android.py

  android-unit:
    # The phone app's JVM tests (view models, voice session, manifest checks). They need the generated
    # Kotlin binding of the Kernel, which is built here the same way as in the kernel lane.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/rust-cache

      # Cache only dependencies and content-addressed task outputs, not Gradle credentials.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-temurin21-${{ steps.java.outputs.version }}-${{ hashFiles('android/**/*.gradle.kts', 'android/**/*.toml', 'android/**/*.properties', 'android/**/*.kt', 'android/**/*.xml', 'Cargo.lock', 'kernel/**/*.rs') }}

      - name: Build the Kotlin binding
        run: python tools/kernel/build_bindings.py

      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

  avatar:
    # three.js + three-vrm page: unit tests (events, mood faces, stale epochs, frame cap, lip-sync offset)
    # and browser tests in Edge (offline load, CSP, no network, drawing stops when off). Needs the
    # placeholder model, which is in Git LFS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: avatar/package-lock.json

      - name: Install
        working-directory: avatar
        run: npm ci

      - name: Build
        working-directory: avatar
        run: npm run build

      - name: Unit tests
        working-directory: avatar
        run: npm test

      - name: Browser tests (Edge)
        working-directory: avatar
        run: npm run test:e2e
