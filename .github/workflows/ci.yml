name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    # REVA is Windows-first; CI runs on Windows so path/pragma/process
    # behavior is validated on the actual target platform.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The Core loads the Rust Domain Kernel through its generated Python binding.
      - name: Build Domain Kernel binding
        run: python tools/kernel/build_bindings.py

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy reva_core

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Contract tests
        run: pytest tests/contract -v

      - name: Security tests
        run: pytest tests/security -v

      - name: E2E tests
        run: pytest tests/e2e -v

      - name: Full suite with coverage
        run: pytest --cov=reva_core --cov-report=term-missing --cov-report=xml

      - name: Package/import smoke test
        run: python -c "import reva_core; print(reva_core.__version__)"

      - name: Core startup/shutdown smoke test
        run: python -m reva_core
        env:
          REVA_DATA_DIR: ${{ runner.temp }}/reva-ci-data

      - name: Migration/bootstrap script check
        run: python scripts/verify_bootstrap.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  csharp-desktop:
    # windows-latest ships Visual Studio with the WinUI/Windows App SDK
    # MSBuild components preinstalled, so plain `dotnet build`/`dotnet
    # test` work with no VS-path overrides — confirmed locally against
    # the same WindowsAppSDK 2.3.1 baseline this project uses.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # See desktop/Directory.Build.props.
      REVA_CI_BUNDLE_RUNTIME: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore desktop\Reva.Desktop.sln

      - name: Build
        run: dotnet build desktop\Reva.Desktop.sln --configuration Release --no-restore

      - name: Put the checked-in lock files back
        # The runtime-bundling restore adds a second target to them; a test reads the committed file.
        shell: pwsh
        run: git ls-files "desktop/*packages.lock.json" | ForEach-Object { git checkout -- $_ }

      - name: Test
        run: dotnet test desktop\Reva.Desktop.sln --configuration Release --no-build --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none --diag:${{ runner.temp }}/vstest-diag.log --logger "console;verbosity=normal"

      - name: Test host diagnostics (only when the tests failed)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}" -Filter "vstest-diag*" | ForEach-Object { "=== $($_.Name)"; Get-Content $_.FullName | Where-Object { $_ -notmatch "Polling on remoteEndPoint" } | Select-Object -First 70 | ForEach-Object { $_.Substring(0, [Math]::Min(260, $_.Length)) } }

  contracts:
    # Every schema in contracts/ must be a valid JSON Schema, and contracts/
    # must match docs/spec/REVA_v2.0/08_CONTRACTS.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install "jsonschema>=4.22,<5"

      - name: Validate contracts
        run: python tools/ci/check_contracts.py

  kernel:
    # Rust Domain Kernel: format, lint, native tests, then the same conformance suite through the
    # Python and Kotlin (JVM) bindings.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Native tests (recovery, sync, import, registry, no-network, conformance)
        run: cargo test -p reva-kernel

      - name: Build bindings
        run: python tools/kernel/build_bindings.py

      - name: Conformance through Python
        run: python -m pytest tests/cross_binding -q

      - name: Conformance through Kotlin (JVM)
        run: python tools/kernel/run_kotlin_conformance.py

  android:
    # Cross-build the Kernel for Android and verify the ELF files. The Kotlin suite runs on a device
    # or emulator from S11 (Android shell).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build arm64-v8a and x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: python tools/kernel/build_android.py
