<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REVA avatar</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    /* fixed: sized by the viewport, not by html/body height (a WebView can report those as 0) */
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <script src="./avatar.js"></script>
</body>
</html>
